name: build-and-deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-local-k3s
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux, k3s]
    environment: local-k3s
    env:
      NAMESPACE: demo
      RELEASE: hello
    steps:
      - uses: actions/checkout@v4

      - name: Verify cluster access
        run: |
          kubectl version
          kubectl get nodes -o wide

      - name: Ensure namespace and GHCR pull secret
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.repository_owner }}" \
            --docker-password="${{ secrets.GHCR_PULL_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade (auto-rollback on failure)
        run: |
          helm upgrade --install "$RELEASE" ./chart \
            --namespace "$NAMESPACE" \
            --set image.repository="${{ needs.build.outputs.image }}" \
            --set image.tag="${{ needs.build.outputs.tag }}" \
            --atomic --wait --timeout 3m

      - name: Show result
        run: |
          helm -n "$NAMESPACE" history "$RELEASE" --max 5
          kubectl -n "$NAMESPACE" get deploy,pods,svc
