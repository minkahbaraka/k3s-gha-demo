replicaCount: 2

image:
  repository: ghcr.io/OWNER/REPO   # overridden by the workflow
  tag: latest                      # overridden by the workflow
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-pull

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    memory: 64Mi
